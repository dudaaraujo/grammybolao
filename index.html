<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolão do Grammy 2027</title>
  <meta name="description" content="Faça seus palpites para o Grammy 2027 e veja quanto você acertou.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body>
  <div id="app"></div>

  <!-- Player do YouTube -->
  <div id="player" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <strong id="player-title"></strong>
          <span id="player-artist" class="muted"></span>
        </div>
        <button class="icon-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <div class="video-wrap"><iframe id="player-frame" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Dados (troque data.js por outro arquivo para fazer o bolão do Oscar) -->
  <script src="data.js"></script>
  <script src="results.js"></script>
  <script src="app.js"></script>
</body>
</html>
